<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kafetein · Kafein ve tein hesaplayıcı</title>
<meta name="description" content="Gün içinde içtiğin espresso ve çayın vücudunda ne kadar kafein bıraktığını gösteren sade hesaplayıcı.">
<meta name="theme-color" content="#0e0e0e">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jetbrains-mono-latin-ext-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="head">
    <h1 data-i18n="title">KAFETEİN</h1>
    <div class="head-btns">
      <button type="button" id="langBtn" class="btn small" data-i18n="langBtn" data-i18n-label="langLabel">EN</button>
      <button type="button" id="settingsBtn" class="btn small" data-i18n="settings">AYARLAR</button>
    </div>
    <p id="stats" class="dim"></p>
    <p id="stats2" class="dim"></p>
  </header>

  <section class="chart">
    <canvas id="chart" role="img"></canvas>
  </section>

  <div class="selbar" id="selbar">
    <p id="hint" class="dim" data-i18n="hint"></p>
    <div id="selctl" hidden>
      <button type="button" class="btn small" id="earlier" data-i18n-label="earlier">−15</button>
      <span id="sellabel" aria-live="polite"></span>
      <button type="button" class="btn small" id="later" data-i18n-label="later">+15</button>
      <button type="button" class="btn small" id="del" data-i18n="del">SİL</button>
    </div>
  </div>

  <div class="add">
    <button type="button" class="btn drink" id="addEsp">
      <span class="ico" id="icoEsp"></span>
      <span class="drink-text"><b data-i18n="esp">ESPRESSO</b><small id="subEsp"></small></span>
      <span class="plus" aria-hidden="true">+</span>
    </button>
    <button type="button" class="btn drink" id="addTea">
      <span class="ico" id="icoTea"></span>
      <span class="drink-text"><b data-i18n="tea">ÇAY</b><small id="subTea"></small></span>
      <span class="plus" aria-hidden="true">+</span>
    </button>
  </div>

  <footer class="foot">
    <p id="lastCup"></p>
    <p id="nowLevel" class="dim"></p>
  </footer>

  <ol id="log" class="sr-only"></ol>
</main>

<dialog id="settings" closedby="any" aria-labelledby="setTitle">
  <div class="sheet-head">
    <h2 id="setTitle" data-i18n="settings">AYARLAR</h2>
    <form method="dialog"><button class="btn small" autofocus data-i18n="close">KAPAT</button></form>
  </div>
  <div id="fields"></div>
  <div class="row">
    <label for="bed" data-i18n="bedtime">UYKU SAATİ</label>
    <input type="time" id="bed" required>
  </div>
  <div class="row">
    <span id="lblLang" data-i18n="language">DİL</span>
    <div class="seg" role="group" aria-labelledby="lblLang">
      <button type="button" class="btn small" data-lang="tr">TÜRKÇE</button>
      <button type="button" class="btn small" data-lang="en">ENGLISH</button>
    </div>
  </div>
  <p class="note" data-i18n="note1"></p>
  <p class="note" data-i18n="note2"></p>
  <p class="note" id="note3"></p>
  <div class="sheet-actions">
    <button type="button" class="btn small" id="resetDay" data-i18n="resetDay">GÜNÜ SIFIRLA</button>
    <button type="button" class="btn small" id="resetSet" data-i18n="resetSet">VARSAYILAN AYARLAR</button>
  </div>
</dialog>

<noscript><p style="padding:1rem">Bu sayfa JavaScript gerektirir. · This page needs JavaScript.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
